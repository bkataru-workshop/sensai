[package]
name = "sensai"
version = "0.1.0"
edition = "2024"

[features]
db = ["dep:heed"]

[dependencies]
# HTTP client dependencies
async-stream = "0.3.6"
http-body-util = "0.1.5"
hyper = { version = "1.11.0", features = ["full"] }
hyper-rustls = { version = "0.27.9", features = ["native-tokio", "http1", "http2", "tls12"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "http2", "tokio"] }

# Serialization
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"

# Async runtime
tokio = { version = "1.53.1", features = ["sync", "rt-multi-thread", "macros", "time", "full"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.19"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"

# Async utilities
futures = "0.3.34"

# Error handling
thiserror = "2.0.20"

# String similarity for fuzzy matching
strsim = "0.11.1"

# File system
dirs = "6.0.0"
globset = "0.4.20"
regex = "1.13.1"
walkdir = "2.5.0"

# Ripgrep crates for fast file searching
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
grep-matcher = "0.1.9"

# AWS dependencies for Bedrock
aws-sigv4 = "1.5.1"
aws-credential-types = "1.3.0"
ring = "0.17.14"
hex = "0.4.3"

# Embedded database (optional, behind "db" feature)
heed = { version = "0.22.1", features = ["serde-json"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"
